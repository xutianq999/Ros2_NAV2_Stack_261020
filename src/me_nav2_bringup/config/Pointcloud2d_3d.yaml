Pointcloud2d_3d:
  ros__parameters:
    target_frame: "livox_frame" # 扫描参考坐标系
    transform_tolerance: 0.2
    # 高度是相对 livox_frame 的；livox 在 base_footprint 上方约 0.32 m，
    # 所以 -0.20 约等于离地 0.12 m，1.20 约等于离地 1.52 m。
    # 原来的 0.2/1.0 实际只覆盖离地约 0.52~1.32 m，低矮障碍会被漏掉。
    min_height: -0.20  # 切片下界（约离地 0.12 m，避开地面但保留低矮障碍）
    max_height: 1.20   # 切片上界（约离地 1.52 m）
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087 # 约 0.5 度分辨率
    scan_time: 0.1
    range_min: 0.05     # 最小有效距离（米）
    range_max: 70.0    # 最大有效距离（米）
    use_sim_time: false
