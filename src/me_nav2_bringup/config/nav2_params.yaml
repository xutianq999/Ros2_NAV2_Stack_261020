# =====================================================================
# Nav2 完整配置文件 (Humble 版本)
# 包含：BT Navigator, Controller, Planner, Smoother, Behaviors, 
# Costmaps (Global & Local), Map Server, Waypoint Follower, Velocity Smoother
# =====================================================================

# 行为树导航配置
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map                  # BT导航器所使用的全局坐标系
    robot_base_frame: base_footprint   # 机器人基座坐标系
    odom_topic: /odom                  # 里程计话题名称
    # Humble 读的是 default_nav_to_pose_bt_xml（旧名 default_bt_xml_filename 会被忽略）。
    # 默认值就是上游自带的树（和之前不写这个键时的行为一致）；探索启动会通过
    # bt_xml 参数把它改写成 behavior_trees/ 下的探索专用树。
    # 键必须存在：RewrittenYaml 只改已有的键，不会新增。
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    # 加载BT所需要用到的各种动作和条件插件库


# 局部规划器
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0        # 控制器运行的频率（Hz），即向底盘发cmd_vel的频率
    min_x_velocity_threshold: 0.001   # X方向最小速度阈值（避免极小值导致电机抖动）
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3            # 允许控制器规划失败的时间（秒），超过此时间上报失败给BT
    progress_checker_plugin: "progress_checker" # 进度检查器插件，用于判断机器人是否“卡住”
    goal_checker_plugins: ["general_goal_checker"] # 目标到达检查器插件
    controller_plugins: ["FollowPath"] # 加载的控制器插件列表

    # 进度检查器配置
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 原地对准/贴墙微调不会产生 0.5 m 的 XY 位移，原来的 0.5 m / 10 s
      # 会在狭窄空间里误判"卡住"、反复触发恢复。放宽到 0.25 m / 15 s。
      required_movement_radius: 0.25  # 机器人必须在这个时间内移动的半径（米）
      movement_time_allowance: 15.0   # 允许不移动的最长时间（秒）

    # 目标到达检查器配置
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15          # 到达目标的XY坐标允许误差（米），放宽以避免终点前反复微调
      yaw_goal_tolerance: 0.2618       # 15度 到达目标的角度允许误差（弧度）

    # 局部控制器：MPPI（Model Predictive Path Integral）
    #
    # 从 DWB 换成 MPPI 的原因：DWB 是采样-打分式的传统方法，滑移转向机器人在它下面
    # 容易出现震荡（原配置甚至要专门挂一个 Oscillation critic 去压）。MPPI 通过大量
    # 轨迹采样 + 加权平均直接优化出一条平滑、连续的控制序列，对非完整约束更友好，
    # 是 Nav2 当前推荐的控制器。
    #
    # 参数按本车限制适配：vx_max/wz_max 与 velocity_smoother 的 max_velocity 保持一致
    # （0.4 m/s、1.0 rad/s），否则两层限制不一致会导致减速被反复裁剪。
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 采样规模：时间步长 × 步数 = 预测时域。56 × 0.05s = 2.8s
      # batch_size 取 1000（官方示例常用 2000）：控制器跑在 20Hz 上，
      # 采样量过大会让单周期计算超时，反而变差。
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1

      # 采样噪声标准差：越大探索越激进
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4

      # 速度/转向限制（与 velocity_smoother 保持一致）
      vx_max: 0.4
      vx_min: -0.4           # 允许倒车（本车 min_vel_x 一直是负的）
      vy_max: 0.0            # 差速/滑移转向不需要横向速度
      wz_max: 1.0

      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]

      # 运动学约束（加速度、转向角限制）
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # 障碍避让。consider_footprint 必须开：本车轮廓是 0.69×0.57 的矩形，
      # 关掉的话只按中心点判碰撞，会明显低估车角扫过的区域。
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 3.0
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.15
        near_goal_distance: 0.5
        inflation_radius: 0.4      # 0.5 在窄门/小房间会堵死，回到 0.4
        cost_scaling_factor: 2.5   # 与局部代价地图一致，扩大高代价带

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      # 贴合全局路径
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

      # 抑制无谓的倒车：只在确实需要（比如卡住）时才允许
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

