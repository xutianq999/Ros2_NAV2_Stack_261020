            const drawGrid = (key, enabled) => {
                const grid = state.grids[key];
                const img = state.gridImages[key];
                if (!enabled || !img || !grid) return;
                const { resolution, width, height, origin } = grid.info;
                let px = origin.position.x, py = origin.position.y, pyaw = 0;
                const frame = grid.header && grid.header.frame_id ? grid.header.frame_id : 'map';
                if (frame !== 'map') {
                    const tf = lookupTf(FRAME_MAP, frame);
                    if (tf) {
                        const P = composePose(tf, { x: px, y: py, z: 0, qx: 0, qy: 0, qz: 0, qw: 1 });
                        px = P.x; py = P.y;
                        pyaw = yawFromQuaternion({ x: P.qx, y: P.qy, z: P.qz, w: P.qw });
                    }
                }
                const p = worldToScreen(px, py);
                ctx.save();
                ctx.translate(p.x, p.y);
                if (pyaw) ctx.rotate(-pyaw);   // 世界逆时针 = 画布顺时针（y 翻转）
                ctx.scale(state.view.scale, -state.view.scale);
                ctx.drawImage(img, 0, 0, width * resolution, height * resolution);
                ctx.restore();
            };
            drawGrid('map', elements.layerMap.checked);
            drawGrid('gcost', elements.layerGlobalCostmap.checked);
            drawGrid('lcost', elements.layerLocalCostmap.checked);

            // --- 规划路径 ---
            if (elements.layerPath.checked && state.pathPoses.length > 1) {
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                state.pathPoses.forEach((p, i) => {
                    const s = worldToScreen(p.x, p.y);
                    if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
                });
                ctx.stroke();
            }

            // --- 航点 ---
            state.waypoints.forEach((wp, i) => {
                const s = worldToScreen(wp.x, wp.y);
                const active = state.wn.running && state.wn.idx === i;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 11, 0, Math.PI * 2);
                ctx.fillStyle = active ? '#51cf66' : '#ffc947';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = active ? '#2f9e44' : '#b08a2e';
                ctx.stroke();
                ctx.fillStyle = '#1a1d2e';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(i + 1), s.x, s.y + 1);
            });

            // --- 目标标记 ---
            if (state.goalMarker) {
                const s = worldToScreen(state.goalMarker.x, state.goalMarker.y);
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(-state.goalMarker.yaw);
                ctx.beginPath();
                ctx.moveTo(16, 0);
                ctx.lineTo(-8, -10);
                ctx.lineTo(-4, 0);
                ctx.lineTo(-8, 10);
                ctx.closePath();
                ctx.fillStyle = '#ff4d4f';
                ctx.fill();
                ctx.restore();
            }

            // --- 机器人 ---
            if (elements.layerRobot.checked && state.robotPose) {
                const s = worldToScreen(state.robotPose.x, state.robotPose.y);
                const age = (Date.now() - state.robotPose.t) / 1000;
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(-state.robotPose.yaw);
                ctx.globalAlpha = age > 2 ? 0.35 : 1;
                ctx.beginPath();
                ctx.moveTo(18, 0);
                ctx.lineTo(-12, -11);
                ctx.lineTo(-6, 0);
                ctx.lineTo(-12, 11);
                ctx.closePath();
                ctx.fillStyle = '#4ade80';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#166532';
                ctx.stroke();
                ctx.restore();
            }
        }

        // ============================================
        // 地图点击处理（按当前模式）
        // ============================================
        function handleMapClick(e) {
            const rect = elements.canvas.getBoundingClientRect();
            const w = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);

            if (state.mode === 'waypoint') {
                addWaypoint(w.x, w.y);
            } else if (state.mode === 'pose') {
                // 拖动设定朝向：以点击点相对机器人的方向作为朝向
                const yaw = state.robotPose ? Math.atan2(w.y - state.robotPose.y, w.x - state.robotPose.x) : 0;
                sendInitialPose(w.x, w.y, yaw);
            } else {
                sendGoal(w.x, w.y, defaultGoalYaw(w));
                setNavState('目标已发送...');
            }
        }

        // ============================================
        // 统计
        // ============================================
        function countMsg() {
            state.msgCount++;
            state.fpsCount++;
        }

        function updateFps() {
            const now = Date.now();
            const elapsed = (now - state.lastFps) / 1000;
            const hz = Math.round(state.fpsCount / elapsed);
            state.fpsCount = 0;
            state.lastFps = now;
            if (state.connected) {
                elements.statusText.textContent = `已连接 · ${hz} msg/s`;
            }
        }

        // ============================================
        // Start
        // ============================================
        init();
    </script>
</body>

</html>
